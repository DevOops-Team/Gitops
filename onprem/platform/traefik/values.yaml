deployment:
  replicas: 3
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
    # LoadBalancer Service의 VIP(172.30.0.125)를 Ingress 상태에 그대로 기록한다 (ADR-22)
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: false
# ADR-22 · GPU-115: MetalLB L2 VIP. pfSense는 WAN:443 → 172.30.0.125:443으로 넘긴다.
# Local: 사용자 IP를 Traefik까지 보존하고, Traefik Pod가 있는 worker만 VIP를 알린다.
# NodePort 30443은 전환 기간(Tailscale 확인용)으로 유지.
service:
  annotations:
    metallb.universe.tf/address-pool: platform-vip
    metallb.universe.tf/loadBalancerIPs: 172.30.0.125
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Local
ports:
  web:
    expose:
      default: false
  websecure:
    expose:
      default: true
    nodePort: 30443
nodeSelector:
  platform-worker: 'true'
tolerations: []
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
      topologyKey: kubernetes.io/hostname
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
accessLog:
  enabled: true
  format: json
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1
