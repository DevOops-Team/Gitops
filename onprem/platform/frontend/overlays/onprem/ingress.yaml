apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - devoops.site
    secretName: frontend-tls
  rules:
  - host: devoops.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
