apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: platform
  # 공인 경로 (GPU-115 · GPU-273): Cloudflare(devoops.site, 프록시, Origin Rule 포트 30600) → 112.218.95.58:30600
  # → 192.168.200.100:1 (pve4 wlo1, 공인 30600~30609 = .100의 포트 1~10) → pve4 DNAT → pfSense WAN 10.255.255.2:443
  # → NAT → VIP 172.30.0.125:443 (Traefik).
  # Host가 devoops.site인 요청만 받는다. IP 직접 접속이나 다른 Host는 Traefik 404.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - devoops.site
    secretName: frontend-tls
  rules:
  - host: devoops.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
