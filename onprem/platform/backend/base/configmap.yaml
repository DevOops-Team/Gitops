apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: platform
data:
  AWS_REGION: us-east-2
  # infra 20-data의 bucket_name (bucket_prefix라 apply할 때마다 이름이 바뀐다). 재구축 후 실제 값으로 바꾼다.
  S3_BUCKET: replace-me-20-data-bucket-name
  PROGRESS_TABLE: devoops-job-progress
  EVENTS_TABLE: devoops-job-events
