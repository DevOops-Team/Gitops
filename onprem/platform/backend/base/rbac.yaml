# Backend가 학습 namespace에서 쓰는 리소스만 연다 (GPU-294).
# Backend는 client-go dynamic client로 jobsets(생성 · 조회 · 삭제) · kueue workloads(조회) · events(조회)만 다룬다
#   — Backend 레포 internal/repository/kube.go의 GVR. leases · localqueues · batch jobs · pods는 쓰지 않아 뺐다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-training
  namespace: training
rules:
- apiGroups:
  - jobset.x-k8s.io
  resources:
  - jobsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - workloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-training
  namespace: training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-training
subjects:
- kind: ServiceAccount
  name: backend
  namespace: platform
