apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend
      nodeSelector:
        platform-worker: 'true'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: backend
            topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532           # 인증서 Secret 파일(0440)을 aws-auth가 읽게
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - name: aws-cert
        secret:
          secretName: backend-aws-identity
          defaultMode: 0440
          items:                 # 인증서 · 키만 파일로 (ARN · 버킷은 env)
          - {key: client.pem, path: client.pem}
          - {key: client.key, path: client.key}
      # AWS(S3 code/ · datasets/, 펜싱 DynamoDB)는 Roles Anywhere 인증 sidecar로 붙는다 (GPU-185, K8s aws-signing-helper/README.md).
      # 개인 키는 aws-auth에만. Backend는 127.0.0.1:9911에서 1시간 임시 키만 받는다.
      # 앱이 9911을 기다리지 않는다: 이미지가 distroless라 셸이 없고, Go AWS SDK v2는 첫 호출 때 자격 증명을 받고
      # 실패하면 다음 호출에서 다시 받는다 (시작 때 고정하지 않음).
      initContainers:
      - name: aws-auth           # 네이티브 sidecar (k8s 1.29+). startupProbe 없음: serve는 127.0.0.1만 열어 kubelet 탐침이 닿지 않는다
        image: ghcr.io/devoops-team/aws-signing-helper   # digest는 overlays/onprem images:
        restartPolicy: Always
        args:
        - serve
        - --certificate=/var/run/devoops-aws/client.pem
        - --private-key=/var/run/devoops-aws/client.key
        - --trust-anchor-arn=$(TRUST_ANCHOR_ARN)
        - --profile-arn=$(PROFILE_ARN)
        - --role-arn=$(ROLE_ARN)
        - --region=us-east-2
        env:                     # ARN · 버킷은 Secret backend-aws-identity (계정 ID를 공개 레포에 두지 않음)
        - {name: TRUST_ANCHOR_ARN, valueFrom: {secretKeyRef: {name: backend-aws-identity, key: trust_anchor_arn}}}
        - {name: PROFILE_ARN, valueFrom: {secretKeyRef: {name: backend-aws-identity, key: profile_arn}}}
        - {name: ROLE_ARN, valueFrom: {secretKeyRef: {name: backend-aws-identity, key: role_arn}}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: aws-cert, mountPath: /var/run/devoops-aws, readOnly: true}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
      containers:
      - name: backend
        image: ghcr.io/devoops-team/backend:configure-me
        imagePullPolicy: IfNotPresent
        volumeMounts: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: LISTEN_ADDR
          value: ':8000'
        - name: TRAINING_NAMESPACE
          value: training
        # AWS 자격 증명은 aws-auth sidecar (IMDS 형식). 끝의 / 필수
        - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
          value: http://127.0.0.1:9911/
        # 체크포인트 버킷 (계정 ID 포함이라 Secret). 학습 JobSet env로도 넘어간다
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef: {name: backend-aws-identity, key: s3_bucket}
        # 데이터 DB backend_ro 비밀번호 (Git에 넣지 않음). PGHOST 등은 backend-config
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: {name: backend-db, key: PGPASSWORD}
        # 브라우저는 Frontend nginx를 거쳐 같은 주소로 부르므로 CORS는 실제로 쓰이지 않는다. 외부 주소만 허용해 둔다.
        - name: ALLOWED_ORIGIN
          value: https://devoops.site
        # 학습 JobSet의 ckpt-init · ckpt-sidecar 이미지 (Data 레포 checkpoint/). Backend는 실행하지 않고 JobSet에 적기만 한다.
        # 값은 overlay images 항목(봇, ADR-23)이 @sha256 digest로 바꾼다 — image-paths.yaml 참고
        - name: CHECKPOINT_IMAGE
          value: ghcr.io/devoops-team/checkpoint
        # 학습 JobSet의 trainer 이미지 (Backend 레포 trainer/, train.py 포함). Backend CI 봇이 digest를 넣는다
        - name: TRAINER_IMAGE
          value: ghcr.io/devoops-team/trainer
        envFrom:
        # AWS_REGION · FENCING_TABLE · KAFKA_BOOTSTRAP · KAFKA_TOPIC_LIFECYCLE · PGHOST 등 (S3_BUCKET · PGPASSWORD는 위 env, Secret)
        - configMapRef:
            name: backend-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
