apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: platform
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: RECOVERY_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: backend-recovery-api
              key: token
              optional: true # 미준비 시 Backend의 internal API만 503, 기존 웹 API는 유지
