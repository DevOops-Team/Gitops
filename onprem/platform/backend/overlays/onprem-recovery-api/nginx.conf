pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  # 읽기 전용 루트: 쓰지 않는 모듈의 임시 경로도 nginx가 시작 때 만든다 (/var/cache/nginx면 mkdir 실패로 기동 불가)
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  server {
    listen 8443 ssl;
    server_name backend-recovery.platform.svc;
    ssl_certificate /etc/recovery-tls/tls.crt;
    ssl_certificate_key /etc/recovery-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /healthz { return 200 "ok\n"; }
    location ~ ^/internal/v1/recovery/jobs/[a-z0-9]+$ {
      limit_except GET { deny all; }
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
    }
    location / { return 404; }
  }
}
