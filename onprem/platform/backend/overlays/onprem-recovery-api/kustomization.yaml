apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 선택 overlay: 인증서/토큰/Backend 배치 출처 준비 후 기존 gpu-backend의 path만 전환한다.
resources:
- ../onprem
- service.yaml
configMapGenerator:
- name: backend-recovery-proxy
  namespace: platform
  files:
  - nginx.conf
  - run.sh
patches:
- path: tls-proxy.patch.yaml
