# 내부 API 전용 PKI. 공개 DNS/Ingress/Cloudflare/기존 frontend-tls는 사용하지 않는다.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: backend-recovery-selfsigned
  namespace: platform
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-recovery-root-ca
  namespace: platform
spec:
  isCA: true
  commonName: backend-recovery-internal-ca
  secretName: backend-recovery-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: backend-recovery-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: backend-recovery-ca
  namespace: platform
spec:
  ca:
    secretName: backend-recovery-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-recovery-tls
  namespace: platform
spec:
  secretName: backend-recovery-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
  - backend-recovery
  - backend-recovery.platform
  - backend-recovery.platform.svc
  - backend-recovery.platform.svc.cluster.local
  usages: [server auth, digital signature]
  issuerRef:
    name: backend-recovery-ca
    kind: Issuer
