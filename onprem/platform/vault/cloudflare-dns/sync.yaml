# KV와 기존 Secret의 모든 값이 같고 초기 동기화가 성공한 뒤 인계한다.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-dns-sync
  namespace: cert-manager
spec:
  vaultAuthRef: cloudflare-dns-sync
  mount: devoops
  type: kv-v2
  path: onprem/cert-manager/cloudflare-dns-api-token
  refreshAfter: 60s
  destination:
    create: false
    name: cloudflare-dns-api-token
    transformation:
      excludeRaw: true
# Cloudflare 토큰 재발급·cert-manager 재시작·인증서 Secret 인수는 하지 않는다.
