apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-recovery-api-sync
  namespace: platform
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: backend-recovery-api-auth
  namespace: platform
spec:
  vaultConnectionRef: vault-vm
  method: kubernetes
  mount: onprem
  kubernetes:
    role: platform-backend-recovery-api-sync
    serviceAccount: backend-recovery-api-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-platform-backend-recovery-api-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-platform-backend-recovery-api-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-platform-backend-recovery-api-tokenreview
subjects:
  - kind: ServiceAccount
    name: backend-recovery-api-sync
    namespace: platform
