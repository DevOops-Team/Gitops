# 기존 common의 namespace별 vault-vm 연결을 재사용한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-sync
  namespace: platform
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ghcr-pull-sync
  namespace: platform
spec:
  vaultConnectionRef: vault-vm
  method: kubernetes
  mount: onprem
  kubernetes:
    role: platform-ghcr-pull-sync
    serviceAccount: ghcr-pull-sync
---
# client JWT reviewer 방식: 이 인증 SA에 TokenReview create만 허용한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-platform-ghcr-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-platform-ghcr-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-platform-ghcr-tokenreview
subjects:
  - kind: ServiceAccount
    name: ghcr-pull-sync
    namespace: platform

---
