# KV와 기존 Secret의 모든 값이 같고 초기 동기화가 성공한 뒤 인계한다.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: collector-db-sync
  namespace: data-system
spec:
  vaultAuthRef: collector-db-sync
  mount: devoops
  type: kv-v2
  path: onprem/data-system/collector-db
  refreshAfter: 60s
  destination:
    create: false
    name: collector-db
    transformation:
      excludeRaw: true
# rolloutRestartTargets 없음: 비밀번호 교체/앱 재시작은 이번 인계 범위가 아니다.
