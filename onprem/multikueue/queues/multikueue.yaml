# MultiKueue: ClusterQueue의 AdmissionCheck multikueue-ac → MultiKueueConfig → 워커 클러스터 목록
# 관리 Kueue는 dispatcherName(scheduling.gpu-project.io/binpack)이 켜져 있어 dispatcher가
# Workload.status.nominatedClusterNames에 적은 워커에만 복사본을 만든다 (GPU-131)
# kubeconfig Secret kueue-system/eks-*-kubeconfig(키 kubeconfig)는 IaC가 EKS 생성 · 삭제 때 등록 · 삭제한다 (GPU-126).
# Secret이 없는 클러스터는 Active=False로 남고 지명 대상이 되지 않는다
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: multikueue-ac
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: MultiKueueConfig
    name: multikueue-config
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueConfig
metadata:
  name: multikueue-config
spec:
  clusters:
  - eks-a
  - eks-b
  - eks-c
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: eks-a
spec:
  clusterSource:
    kubeConfig:
      location: eks-a-kubeconfig
      locationType: Secret
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: eks-b
spec:
  clusterSource:
    kubeConfig:
      location: eks-b-kubeconfig
      locationType: Secret
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: eks-c
spec:
  clusterSource:
    kubeConfig:
      location: eks-c-kubeconfig
      locationType: Secret
