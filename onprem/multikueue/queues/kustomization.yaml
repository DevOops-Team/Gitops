apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 관리 클러스터 큐 (원본 K8s 1cfe597^:scheduling/queues/manager). training 네임스페이스는 gpu-foundation이 만든다
# 쿼터는 test 구성(EKS 2개 x 학습 4 + 예비 1) 기준: heavy 6 · light 2 · recovery 4 (GPU-258).
# 학습 쿼터 합이 실제 학습 GPU보다 크면 쿼터 대기가 안 생겨 Heavy 순서 · 포화 규칙이 드러나지 않는다.
# full(EKS 3개)로 갈 때 clusterqueue.yaml을 heavy 8 · light 4로 되돌린다 (recovery 4는 그대로)
resources:
- resourceflavor.yaml
- priorityclass.yaml
- multikueue.yaml
- clusterqueue.yaml
- localqueue.yaml
