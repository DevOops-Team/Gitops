apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 관리 클러스터 큐 (원본 K8s 1cfe597^:scheduling/queues/manager). training 네임스페이스는 gpu-foundation이 만든다
# 쿼터는 full 구성(EKS 3개 x 학습 4 + 예비) 기준. 실제 자리는 dispatcher가 워커 노드 · 쿼터를 보고 판단하므로
# 지금 테스트 구성(eks-a GPU 2)에서도 그대로 둔다
resources:
- resourceflavor.yaml
- priorityclass.yaml
- multikueue.yaml
- clusterqueue.yaml
- localqueue.yaml
