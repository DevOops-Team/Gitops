apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 매니저 클러스터 Kueue v0.20.4 (kueue-system). 업스트림 매니페스트 + 패치만
# 원본: K8s 레포 scheduling/kueue/base + scheduling/kueue/manager
resources:
- kueue-v0.20.4-manifests.yaml
- kueue-v0.20.4-workload-map.yaml
- pdb.yaml
configMapGenerator:
  - name: kueue-manager-config
    namespace: kueue-system
    behavior: replace
    files:
      - controller_manager_config.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  # CPU requests 500m -> 250m (관리 worker 1대 장애 시 CPU 여유 확보, EKS 시스템 노드 공간 확보)
  # limits(cpu 2, memory 512Mi)와 memory requests는 기본값 유지
  - target:
      kind: Deployment
      name: kueue-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kueue-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  requests:
                    cpu: 250m
  # 3중화 (11/09): 관리 worker 3대에 하나씩. 리더 1개만 입장·MultiKueue 일을 하고, 웹훅은 3개 모두 받음
  # -> Pod 하나가 죽어도 training 잡 생성이 웹훅(failurePolicy Fail)에서 막히지 않음
  - target:
      kind: Deployment
      name: kueue-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kueue-controller-manager
      spec:
        replicas: 3
        strategy:                # 노드 3대에 하나씩이라 하나 내리고 하나 올림 (maxSurge 0)
          type: RollingUpdate
          rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
        template:
          spec:
            nodeSelector: {platform-worker: 'true'}
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app.kubernetes.io/name: kueue}}
                  topologyKey: kubernetes.io/hostname
  # 1.35에는 MAP v1이 없음 (1.36 GA). v1beta1로 내려서 적용
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingAdmissionPolicy
    patch: |-
      - op: replace
        path: /apiVersion
        value: admissionregistration.k8s.io/v1beta1
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingAdmissionPolicyBinding
    patch: |-
      - op: replace
        path: /apiVersion
        value: admissionregistration.k8s.io/v1beta1
