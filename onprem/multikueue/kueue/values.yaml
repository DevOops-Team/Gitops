# 관리 클러스터 Kueue v0.20.4 (ADR-9) — 공식 Helm 차트 oci://registry.k8s.io/kueue/charts/kueue 의 values
# Application gpu-kueue가 차트 + 이 디렉토리(Namespace · MAP)를 함께 배포한다
controllerManager:
  # 3중화: 관리 worker 3대에 하나씩. 리더 1개만 입장 · MultiKueue 일을 하고 웹훅은 3개 모두 받음
  # -> Pod 하나가 죽어도 training 잡 생성이 웹훅(failurePolicy Fail)에서 막히지 않음
  replicas: 3
  strategy:                    # 노드 3대에 하나씩(required anti-affinity)이라 하나 내리고 하나 올림
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  nodeSelector: {platform-worker: 'true'}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector: {matchLabels: {app.kubernetes.io/name: kueue, control-plane: controller-manager}}
        topologyKey: kubernetes.io/hostname
  podDisruptionBudget:         # 노드 drain 때도 둘은 남김
    enabled: true
    minAvailable: 2
  manager:
    resources:                 # CPU requests 500m -> 250m: 관리 worker 1대 장애 시 여유. limits · memory는 기본값
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: '2', memory: 512Mi}

managerConfig:
  controllerManagerConfigYaml: |-
    apiVersion: config.kueue.x-k8s.io/v1beta2
    # Kueue가 도는 네임스페이스. 웹훅 인증서 이름·MultiKueue kubeconfig Secret 위치도 여기
    namespace: kueue-system
    clientConnection:
      burst: 500
      qps: 300
    controller:
      groupKindConcurrency:
        ClusterQueue.kueue.x-k8s.io: 5
        Cohort.kueue.x-k8s.io: 1
        Job.batch: 5
        LocalQueue.kueue.x-k8s.io: 5
        Pod: 5
        ResourceFlavor.kueue.x-k8s.io: 1
        Workload.kueue.x-k8s.io: 10
    health:
      healthProbeBindAddress: :8081
    integrations:
      frameworks:
      - batch/job
      - jobset.x-k8s.io/jobset
    internalCertManagement:
      enable: true
      webhookSecretName: kueue-webhook-server-cert
      webhookServiceName: kueue-webhook-service
    kind: Configuration
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    multiKueue:
      # 워커가 이 시간보다 오래 끊기면 MultiKueue가 잡을 다른 워커로 다시 보냄 -> 같은 세대가 두 클러스터에서 돌 수 있음.
      # 재디스패치는 끄고(크게) 복구 컨트롤러가 새 세대로만 재시작 (JobSet 템플릿 5절, 한송이 11/04 동의)
      workerLostTimeout: 24h
      dispatcherName: scheduling.gpu-project.io/binpack
