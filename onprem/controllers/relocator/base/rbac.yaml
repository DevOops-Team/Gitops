# relocator 권한 (관리 클러스터). 원본 K8s 1cfe597^:scheduling/controllers/deploy/controllers.yaml
# 워커 EKS의 노드 cordon · taint는 여기가 아니라 EKS 쪽 relocator SA 권한이다 (IaC eks-hub-registration/relocator.tf, GPU-174)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scheduling-relocator
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch]                 # 재제출 잡 입장 확인
- apiGroups: [kueue.x-k8s.io]
  resources: [multikueueclusters]
  verbs: [get, list, watch, patch]          # 워커 목록 + 펜싱 라벨 devoops/fenced
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests]
  verbs: [get, list, watch]                 # 복구 컨트롤러가 만든 재배치 요청
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests/status]
  verbs: [get, patch]                       # 단계 시각 · 결과 (admission policy가 relocator만 허용)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scheduling-relocator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: scheduling-relocator}
subjects:
- {kind: ServiceAccount, name: relocator, namespace: platform}
---
# 잡 내리기 · 재제출은 학습 네임스페이스에서만 (JOB_NAMESPACE=training)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduling-relocator-jobsets
  namespace: training
rules:
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduling-relocator-jobsets
  namespace: training
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scheduling-relocator-jobsets}
subjects:
- {kind: ServiceAccount, name: relocator, namespace: platform}
---
# 워커 kubeconfig: relocator 전용 Secret만 (IaC가 EKS마다 kueue-system/<eks>-relocator-kubeconfig 등록, GPU-174).
# MultiKueue Secret(eks-*-kubeconfig)은 주지 않는다: 전용 Secret이 없으면 그 워커는 건너뛰고 경고를 남긴다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduling-relocator-kubeconfig
  namespace: kueue-system
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [eks-a-relocator-kubeconfig, eks-b-relocator-kubeconfig, eks-c-relocator-kubeconfig]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduling-relocator-kubeconfig
  namespace: kueue-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scheduling-relocator-kubeconfig}
subjects:
- {kind: ServiceAccount, name: relocator, namespace: platform}
---
# 리더 선출 Lease platform/scheduling-relocator (common/leader.py). create는 이름으로 좁힐 수 없다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduling-relocator-leader
  namespace: platform
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [scheduling-relocator]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduling-relocator-leader
  namespace: platform
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scheduling-relocator-leader}
subjects:
- {kind: ServiceAccount, name: relocator, namespace: platform}
