apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# dispatcher · relocator · recovery-controller가 함께 쓰는 것 (원본 K8s 1cfe597^:scheduling/controllers/deploy)
# - RelocationRequest CRD (ADR-19): 복구 → 스케줄링 재배치 요청. dispatcher는 진행 중인 요청을 읽어 원래 클러스터 자리를 지킨다
# - admission policy: RBAC로 못 막는 5가지를 API 서버에서 거절 (SA 이름이 바뀌면 같이 고칠 것)
resources:
- crd-relocationrequest.yaml
- admission-policy.yaml
