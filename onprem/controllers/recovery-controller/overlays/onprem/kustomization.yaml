apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
configMapGenerator:
- name: recovery-controller-config
  namespace: platform
  behavior: replace
  files:
  - config.json
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: recovery-controller
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: recovery-controller
    spec:
      template:
        metadata:
          annotations:
            devoops/config-sha256: 46c87a568a77c7540fb91d5fd8cbbe06d52d421c4afde8a4334a20bbe3ac56e1
# 온프레: 3개 (platform-worker 노드마다 하나). base는 0 (render.py 기본값과 맞춤)
# Kafka 실제 복구 execute 모드 (GPU-222). config.json 변경 시 checksum도 갱신한다.
replicas:
- count: 3
  name: recovery-controller
# aws-signing-helper는 사람이 올린다 (helper 버전은 배포 쪽에서 관리, K8s aws-signing-helper/README.md)
images:
- digest: sha256:527d6ffc3a8c1fde7de34273890f3cc16b83f23f8e5e881485b479c696352203
  name: ghcr.io/devoops-team/aws-signing-helper
  newName: ghcr.io/devoops-team/aws-signing-helper
  newTag: 1.1.0
- digest: sha256:3526d1f64d93f27588c7d713d97b241d108fb7bf675b5c1425cd1b514b458cea
  name: ghcr.io/devoops-team/recovery-controller
  newName: ghcr.io/devoops-team/recovery-controller
  newTag: 1.6.1
