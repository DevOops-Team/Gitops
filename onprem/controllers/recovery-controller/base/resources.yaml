# 복구 컨트롤러 (로직 K8s recovery-controller, 한송이). 원본 K8s e00e83c^:onprem/apps/recovery-controller/resources.yaml
# 한 파일로 둔다: K8s recovery-controller/tools/render.py --manifest 가 이 파일을 읽어 수동 배포본을 만든다.
# Kafka gpu.fault → DynamoDB(recovery_table · 펜싱) → RelocationRequest 생성 → relocator가 실행
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-controller      # admission policy가 이 이름(platform/recovery-controller)에만 RR 생성을 허용한다
  namespace: platform
automountServiceAccountToken: false   # Pod에서만 켠다 (Lease · RR 생성)
imagePullSecrets:
- name: ghcr-pull                # GHCR private 패키지 (recovery-controller · aws-signing-helper)
---
# 리더 선출 Lease (runtime/leadership.py). Argo CD 기본 resource.exclusions가 Lease를 빼서
# 이 사본은 적용되지 않는다 → 컨트롤러가 404면 직접 만든다 (GPU-248). 수동 배포본(render.py)용으로 남긴다
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: recovery-controller
  namespace: platform
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-controller-lease
  namespace: platform
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [recovery-controller]
  verbs: [get, update]
- apiGroups: [coordination.k8s.io]   # create는 resourceNames로 좁힐 수 없다 (platform 네임스페이스 안만)
  resources: [leases]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-controller-lease
  namespace: platform
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: recovery-controller-lease}
subjects:
- {kind: ServiceAccount, name: recovery-controller, namespace: platform}
---
# 재배치 요청은 학습 네임스페이스에 만들기 · 읽기 · 주석 붙이기. 노드 변경 · 잡 재제출은 relocator 몫
# patch: 제어 주석 devoops/recovery-stop-recorded · devoops/recovery-cancel (ADR-50). spec은 CRD가 바꾸지 못하게 막는다
# list · watch: relocator가 쓴 status.recoveryProgress를 보고 펜싱 표에 옮긴다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-controller-relocation
  namespace: training
rules:
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests]
  verbs: [create, get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-controller-relocation
  namespace: training
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: recovery-controller-relocation}
subjects:
- {kind: ServiceAccount, name: recovery-controller, namespace: platform}
---
# 안전한 기본값: 사건을 받지 않고 health만 연다. Kafka 모드 설정은 overlay에서 바꾼다 (README.md)
apiVersion: v1
kind: ConfigMap
metadata:
  name: recovery-controller-config
  namespace: platform
data:
  config.json: |
    {"schema_version": 1, "mode": "observe", "event_source": "disabled", "execution_enabled": false}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-controller
  namespace: platform
  labels: {app.kubernetes.io/name: recovery-controller, app.kubernetes.io/part-of: recovery}
spec:
  replicas: 0                    # 켜는 조건은 README.md. 켤 때 3 (platform-worker 노드마다 하나, Lease 리더 하나만 일함)
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  progressDeadlineSeconds: 180
  selector:
    matchLabels: {app.kubernetes.io/name: recovery-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: recovery-controller, app.kubernetes.io/part-of: recovery}
      annotations:               # 모니터링 Agent(annotated-pods 잡)가 8080/metrics를 긁는다: recovery_hold_total → RecoveryHold 알람
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: recovery-controller
      automountServiceAccountToken: true
      nodeSelector: {platform-worker: 'true'}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app.kubernetes.io/name: recovery-controller}}
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532           # 인증서 Secret 파일(0440)을 aws-auth가 읽게
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: aws-auth           # Roles Anywhere 인증 sidecar (GPU-173). 개인 키는 여기에만
        image: ghcr.io/devoops-team/aws-signing-helper   # digest는 overlays/onprem images:
        restartPolicy: Always
        args:
        - serve
        - --certificate=/var/run/devoops-aws/client.pem
        - --private-key=/var/run/devoops-aws/client.key
        - --trust-anchor-arn=$(TRUST_ANCHOR_ARN)
        - --profile-arn=$(PROFILE_ARN)
        - --role-arn=$(ROLE_ARN)
        - --region=us-east-2
        env:
        - {name: TRUST_ANCHOR_ARN, valueFrom: {secretKeyRef: {name: recovery-controller-aws, key: trust_anchor_arn}}}
        - {name: PROFILE_ARN, valueFrom: {secretKeyRef: {name: recovery-controller-aws, key: profile_arn}}}
        - {name: ROLE_ARN, valueFrom: {secretKeyRef: {name: recovery-controller-aws, key: role_arn}}}
        # startupProbe 없음: serve는 127.0.0.1에서만 열어 kubelet 탐침이 닿지 않는다. 앱이 9911을 기다린다 (controller의 command)
        securityContext:
          runAsUser: 65532       # helper 이미지 사용자 (Pod 기본 10001과 다름)
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: aws-cert, mountPath: /var/run/devoops-aws, readOnly: true}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
      containers:
      - name: controller
        image: ghcr.io/devoops-team/recovery-controller   # digest는 overlays/onprem images: (봇이 갱신, ADR-23)
        # sidecar가 9911을 열 때까지 기다린 뒤 이미지 ENTRYPOINT(python -u /app/main.py)를 실행한다
        command:
        - python
        - -c
        - |
          import os, socket, sys, time
          for _ in range(120):
              try:
                  socket.create_connection(("127.0.0.1", 9911), 1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              sys.exit("aws-auth sidecar가 120초 안에 9911을 열지 않음 (kubectl logs -c aws-auth)")
          os.execvp("python", ["python", "-u", "/app/main.py"])
        ports:
        - {name: health, containerPort: 8080}
        env:
        - name: RECOVERY_POD_UID # Lease holderIdentity
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        - {name: AWS_EC2_METADATA_SERVICE_ENDPOINT, value: "http://127.0.0.1:9911/"}   # 끝의 / 필수
        - {name: AWS_REGION, value: us-east-2}
        - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
        - {name: PYTHONUNBUFFERED, value: '1'}
        envFrom:                 # KAFKA_CLIENT_CONFIG_JSON (Kafka 인증). Kafka 모드에서만 필요
        - secretRef: {name: recovery-controller-credentials, optional: true}
        securityContext:
          runAsUser: 10001       # 이미지 USER 10001:10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        startupProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:          # Kafka 접속 · worker 최근 scan (학습 정상 여부가 아님)
          httpGet: {path: /readyz, port: health}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - {name: config, mountPath: /etc/recovery, readOnly: true}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      volumes:
      - name: config
        configMap: {name: recovery-controller-config}
      - name: aws-cert
        secret:
          secretName: recovery-controller-aws
          defaultMode: 0440
          items:
          - {key: client.pem, path: client.pem}
          - {key: client.key, path: client.key}
