# 관리 클러스터에 올리는 컨트롤러 3개. 네임스페이스 platform (11/05 K8s 아키텍처: 앱은 전부 platform, 권한은 앱별 SA)
# HA: 컨트롤러마다 레플리카 3개를 platform-worker=true 노드(worker1~3)에 하나씩.
#     Lease(platform/scheduling-<이름>)로 리더 하나만 일하고 나머지 둘은 대기 (leader.py)
#     노드 하나가 죽어도 남은 둘 중 하나가 LEASE_SECONDS(15s) 안에 이어받음
# platform 네임스페이스는 Argo CD gpu-foundation(onprem/platform/namespaces)이 만듦
# 원본: K8s 레포 scheduling/controllers/deploy (kind용). 여기는 우리 망 값: eks-a/b/c, RECOVERY_STORE=aws, GHCR 이미지

# 컨트롤러마다 ServiceAccount를 따로 둔다: 필요한 권한만
#   dispatcher: Workload 지명 + 워커 kubeconfig 읽기
#   relocator : JobSet 삭제·생성 + 펜싱 라벨 + 워커 kubeconfig 읽기
#               + 복구 원본·펜싱 기록 (우리 망: S3·DynamoDB를 IAM으로, kind: ConfigMap)
apiVersion: v1
kind: ServiceAccount
metadata: {name: dispatcher, namespace: platform}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: relocator, namespace: platform}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: scheduling-dispatcher}
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch, patch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads/status]
  verbs: [patch]
- apiGroups: [kueue.x-k8s.io]
  resources: [multikueueclusters]
  verbs: [get, list, watch]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get]
- apiGroups: [scheduling.devoops.site]   # 진행 중인 재배치의 원래 클러스터를 재제출 잡 몫으로 지킴 (읽기만)
  resources: [relocationrequests]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: scheduling-relocator}
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [multikueueclusters]
  verbs: [get, list, watch, patch]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get, list, create, delete]
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests]
  verbs: [get, list, watch]
- apiGroups: [scheduling.devoops.site]
  resources: [relocationrequests/status]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: scheduling-dispatcher}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: scheduling-dispatcher}
subjects: [{kind: ServiceAccount, name: dispatcher, namespace: platform}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: scheduling-relocator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: scheduling-relocator}
subjects: [{kind: ServiceAccount, name: relocator, namespace: platform}]
---
# 워커 kubeconfig: 이름을 지정한 Secret만 (Kueue와 같은 kueue-system 네임스페이스)
#   dispatcher: MultiKueue가 쓰는 Secret eks-a/b/c-kubeconfig
#   relocator : EKS마다 따로 만든 relocator SA 토큰 kubeconfig (노드 권한을 MultiKueue와 나눔, IAM 답변 11/05)
#               eks-{a,b,c}-relocator-kubeconfig. 없으면 MultiKueue Secret으로 대신함 (RELOCATOR_KUBECONFIG_SECRET 참고)
# MultiKueueCluster 목록 조회도 필요하지만 그건 위 ClusterRole에 있음
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: scheduling-worker-kubeconfig, namespace: kueue-system}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [eks-a-kubeconfig, eks-b-kubeconfig, eks-c-kubeconfig,
                  eks-a-relocator-kubeconfig, eks-b-relocator-kubeconfig, eks-c-relocator-kubeconfig]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: scheduling-worker-kubeconfig, namespace: kueue-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scheduling-worker-kubeconfig}
subjects:
- {kind: ServiceAccount, name: dispatcher, namespace: platform}
- {kind: ServiceAccount, name: relocator, namespace: platform}
---
# 리더 선출 Lease (자기 네임스페이스, 컨트롤러별 이름)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: scheduling-leader-election, namespace: platform}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: scheduling-leader-election, namespace: platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scheduling-leader-election}
subjects:
- {kind: ServiceAccount, name: dispatcher, namespace: platform}
- {kind: ServiceAccount, name: relocator, namespace: platform}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: platform
spec:
  replicas: 3
  strategy:                      # 노드 3대에 하나씩이라 하나 내리고 하나 올림 (maxSurge 0)
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app: dispatcher}}
  template:
    metadata: {labels: {app: dispatcher}}
    spec:
      serviceAccountName: dispatcher
      nodeSelector: {platform-worker: 'true'}
      affinity:
        podAntiAffinity:         # 같은 노드에 둘 안 올림 -> worker1/2/3에 하나씩
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: dispatcher}}
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      imagePullSecrets: [{name: ghcr-pull}]   # IaC secrets bootstrap이 platform/ghcr-pull 생성
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: main
        image: ghcr.io/devoops-team/scheduling-controllers   # digest는 kustomization.yaml images에서 고정
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        command: ["python", "dispatcher.py"]
        env:
        - name: POD_NAME         # Lease holderIdentity
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dispatcher, namespace: platform}
spec:
  maxUnavailable: 1              # 노드 drain 때도 둘은 남김
  selector: {matchLabels: {app: dispatcher}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relocator
  namespace: platform
spec:
  replicas: 3
  strategy:                      # 노드 3대에 하나씩이라 하나 내리고 하나 올림 (maxSurge 0)
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app: relocator}}
  template:
    metadata: {labels: {app: relocator}}
    spec:
      serviceAccountName: relocator
      nodeSelector: {platform-worker: 'true'}
      affinity:
        podAntiAffinity:         # 같은 노드에 둘 안 올림 -> worker1/2/3에 하나씩
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: relocator}}
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      imagePullSecrets: [{name: ghcr-pull}]   # IaC secrets bootstrap이 platform/ghcr-pull 생성
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: main
        image: ghcr.io/devoops-team/scheduling-controllers   # digest는 kustomization.yaml images에서 고정
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        command: ["python", "relocator.py"]
        env:
        - name: POD_NAME         # Lease holderIdentity
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        # 복구 원본(S3 code/{job_id}/jobset.json)·펜싱 기록(DynamoDB). 체크포인트 규약 13절
        - {name: RECOVERY_STORE, value: aws}
        - {name: AWS_REGION, value: us-east-2}
        - {name: CKPT_BUCKET, value: devoops-prod-ckpt-354363695096-us-east-2}
        - {name: FENCING_TABLE, value: devoops-prod-fencing}
        # 워커 EKS API가 끊겼을 때 EC2 상태로 옛 실행 종료 확인 (ec2_evidence.py)
        # off -> describe (ec2:DescribeInstances 받은 뒤) -> terminate (TerminateInstances 받은 뒤)
        # 켤 때 EC2_CLUSTERS='{"eks-a":"<EKS 이름>",...}', EC2_NODEPOOLS=training,spare (Karpenter NodePool)
        - {name: EC2_EVIDENCE, value: "off"}
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: relocator, namespace: platform}
spec:
  maxUnavailable: 1              # 노드 drain 때도 둘은 남김
  selector: {matchLabels: {app: relocator}}
