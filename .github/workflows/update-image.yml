# 재사용 워크플로: 코드 레포 main CI가 GHCR에 올린 이미지 digest를 Gitops overlay에 반영한다 (GPU-114 · ADR-23).
#
# 호출 예 (Frontend · Backend · K8s 등 이미지를 만드는 레포의 CI):
#   deploy:
#     needs: image
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     uses: DevOops-Team/Gitops/.github/workflows/update-image.yml@main
#     with:
#       image: ghcr.io/devoops-team/frontend
#       digest: ${{ needs.image.outputs.digest }}
#       overlay: ${{ vars.GITOPS_OVERLAY }}
#       version: ${{ needs.plan.outputs.version }}      # 선택. 있으면 newTag로 같이 기록 (GPU-136)
#       base-ref: ${{ needs.plan.outputs.tag }}          # 선택. overlay가 호출 레포를 원격 base로 쓸 때만 (예 Monitoring 분류기, GPU-212)
#       app-id: ${{ vars.DEPLOY_APP_ID }}
#       gitops-repo: ${{ vars.GITOPS_REPO }}
#     secrets:
#       DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}   # 이름으로 꼭 넘겨야 함 (값은 Environment 것이 쓰임)
#
# 봇(GitHub App)만 Gitops main ruleset 우회 대상이다. 바꾸는 것은 overlay kustomization.yaml의 images 항목 하나뿐이다.
#   base-ref를 넘긴 경우에만 같은 파일의 원격 base `github.com/<호출 레포>//…?ref=` 값도 바꾼다 (GPU-212).
#   매니페스트(base)가 호출 레포에 있는 경우(Monitoring 분류기) 이미지와 매니페스트를 같은 릴리스로 맞추기 위함이다.
#   base-ref 태그는 이 job 전에 있어야 한다 (kustomize build로 확인) → 호출 쪽 deploy가 release job 뒤에 돌게 할 것.
#
# 봇 비밀키는 호출 레포 Environment `gitops-deploy`(배포 브랜치 main만)의 Secret DEPLOY_APP_PRIVATE_KEY에만 둔다.
#   main이 아닌 브랜치 · PR에서 이 job을 부르면 Environment 규칙에 막혀 키를 받지 못한다 (GPU-136).
#   재사용 워크플로는 호출 쪽이 secrets:로 이름을 넘겨야 Environment Secret 값을 받는다. 안 넘기면 조용히 빈 값이 된다.
#   호출 레포에 Environment가 없으면 GitHub이 보호 규칙 없이 자동으로 만들므로, 반드시 먼저 만들어 둘 것.
name: update-image

on:
  workflow_call:
    inputs:
      image:
        description: 이미지 이름 (태그 · digest 없이). 예 ghcr.io/devoops-team/frontend
        type: string
        required: true
      digest:
        description: 빌드 출력 digest (sha256:...)
        type: string
        required: true
      version:
        description: 이미지 버전 (예 1.2.0). 있으면 overlay에 newTag로 기록 — 실제 배포는 여전히 digest 기준
        type: string
        default: ""
      base-ref:
        description: 선택. overlay resources의 원격 base github.com/<호출 레포>//…?ref= 값을 이것으로 바꾼다 (예 v1.3.1). 비우면 건너뜀
        type: string
        default: ""
      overlay:
        description: Gitops 안 kustomization 디렉터리. 예 onprem/platform/frontend/overlays/onprem
        type: string
        required: true
      app-id:
        description: GitHub App ID (호출 레포 Variable DEPLOY_APP_ID)
        type: string
        required: true
      gitops-repo:
        description: owner/name (호출 레포 Variable GITOPS_REPO)
        type: string
        required: true
      branch:
        description: 반영할 Gitops 브랜치
        type: string
        default: main
    secrets:
      DEPLOY_APP_PRIVATE_KEY:
        description: 배포 봇 비밀키. 호출 쪽은 이름으로 넘기고, 실제 값은 Environment gitops-deploy의 같은 이름 Secret
        required: false   # 전환 중 옛 호출(app-private-key)을 위해 false. 전환이 끝나면 true
      app-private-key:
        description: 옛 이름 (조직 Secret). 호출 레포 전환 · 조직 Secret 삭제가 끝나면 이 입력과 아래 fallback을 지운다
        required: false

permissions:
  contents: read

jobs:
  update:
    name: update image digest
    runs-on: ubuntu-24.04
    environment: gitops-deploy
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      VERSION: ${{ inputs.version }}
      BASE_REF: ${{ inputs.base-ref }}
      OVERLAY: ${{ inputs.overlay }}
      GITOPS_REPO: ${{ inputs.gitops-repo }}
      BRANCH: ${{ inputs.branch }}
      KUSTOMIZE_VERSION: v5.4.3
      KUSTOMIZE_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7   # linux_amd64, checksums.txt
    steps:
      - name: Check inputs
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest 형식이 아님: '$DIGEST'"; exit 1; }
          [[ "$IMAGE" != *@* && "$IMAGE" != *:* ]] || { echo "::error::image에는 태그 · digest를 붙이지 않음: '$IMAGE'"; exit 1; }
          [[ "$OVERLAY" != /* && "$OVERLAY" != *..* ]] || { echo "::error::overlay는 레포 안 상대 경로: '$OVERLAY'"; exit 1; }
          [[ "$GITOPS_REPO" == */* ]] || { echo "::error::gitops-repo는 owner/name: '$GITOPS_REPO'"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version은 X.Y.Z: '$VERSION'"; exit 1; }
          [[ -z "$BASE_REF" || "$BASE_REF" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::base-ref는 태그 · 커밋 SHA: '$BASE_REF'"; exit 1; }
          echo "owner=${GITOPS_REPO%%/*}" >> "$GITHUB_ENV"
          echo "name=${GITOPS_REPO#*/}" >> "$GITHUB_ENV"

      - name: Check bot key
        env:
          HAS_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY != '' || secrets.app-private-key != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::배포 봇 키가 비어 있음 — 호출 쪽 secrets: DEPLOY_APP_PRIVATE_KEY 전달 · Environment gitops-deploy Secret 확인"; exit 1; }

      # 액션은 커밋 SHA로 고정 (봇 토큰을 다루므로)
      - id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf   # v2.2.1
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY || secrets.app-private-key }}   # Environment gitops-deploy Secret (전환 중 옛 이름 fallback)
          owner: ${{ env.owner }}
          repositories: ${{ env.name }}
          permission-contents: write                           # 토큰도 contents만

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          repository: ${{ inputs.gitops-repo }}
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Install kustomize
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/kustomize.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  $tgz" | sha256sum -c -
          tar xzf "$tgz" -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Update digest and push
        working-directory: gitops
        env:
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          test -f "$OVERLAY/kustomization.yaml" || { echo "::error::$OVERLAY/kustomization.yaml 없음"; exit 1; }
          short_sha="${GITHUB_SHA::7}"
          ref="${IMAGE}${VERSION:+:$VERSION}@${DIGEST}"   # 버전이 있으면 newTag + digest
          label="${VERSION:-sha-${short_sha}}"
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_NAME}@users.noreply.github.com"
          base_pat="github.com/${GITHUB_REPOSITORY}//"   # 호출 레포 자신의 원격 base만 바꾼다
          for attempt in 1 2 3; do
            if [ -n "$BASE_REF" ]; then
              grep -q "${base_pat}.*?ref=" "$OVERLAY/kustomization.yaml" \
                || { echo "::error::base-ref를 받았지만 $OVERLAY/kustomization.yaml에 ${base_pat}…?ref= 원격 base가 없음"; exit 1; }
              sed -i -E "s#(${base_pat}[^?[:space:]]*\?ref=)[^[:space:]]+#\1${BASE_REF}#" "$OVERLAY/kustomization.yaml"
            fi
            (cd "$OVERLAY" && kustomize edit set image "${IMAGE}=${ref}")
            # overlay의 kustomization.yaml 외 다른 파일이 바뀌면 중단
            changed=$(git diff --name-only)
            if [ -z "$changed" ]; then echo "이미 ${DIGEST} — 변경 없음"; exit 0; fi
            [ "$changed" = "$OVERLAY/kustomization.yaml" ] || { echo "::error::예상 밖 변경: $changed"; exit 1; }
            kustomize build "$OVERLAY" > /dev/null
            git commit -am "deploy(${IMAGE##*/}): ${label}" \
              -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" -m "image: ${ref}${BASE_REF:+, base ref: ${BASE_REF}}"
            git push origin "HEAD:${BRANCH}" && { echo "### ${IMAGE##*/} ${VERSION} → \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            echo "push 실패 — ${BRANCH} 다시 받아 재시도 (${attempt}/3)"
            git fetch origin "$BRANCH" && git reset --hard "origin/${BRANCH}"
          done
          echo "::error::Gitops ${BRANCH} push 실패"; exit 1
