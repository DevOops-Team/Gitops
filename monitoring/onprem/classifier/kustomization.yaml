# 분류기 (Alertmanager 웹훅 → 판정 → Kafka gpu.fault). 모니터링 클러스터 monitoring 네임스페이스. 담당: 이태림 (GPU-201)
# base는 Monitoring 레포의 릴리스 태그로 고정한다(main을 가리키지 않는다). Monitoring main 릴리스 때 배포 봇이 ref · newTag · digest를 같이 바꾼다 (update-image.yml base-ref, GPU-212)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- https://github.com/DevOops-Team/Monitoring//deploy/classifier/base?ref=v1.26.0
images:
- digest: sha256:7c85c4bcda766e6118184000878f3e7f4bd8a0d96aa4f8c89a37d4ee4cf8d767
  name: ghcr.io/devoops-team/classifier
  newName: ghcr.io/devoops-team/classifier
  newTag: 1.26.0
# GHCR 패키지가 비공개라 pull secret이 필요하다. Secret ghcr-pull은 Git에 없다(관리 클러스터 platform의 것을 복사해 넣음, Monitoring deploy/README.md)
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value: [{name: ghcr-pull}]
  target:
    kind: Deployment
    name: classifier
# 사이트 신호도 받는다(GPU-220). 코드 기본값은 xid,pod_exit. 이 값과 Monitoring Alertmanager 라우트(signal에 site)가 둘 다 있어야 사이트 장애 → 작업마다 fence_evacuate가 나간다.
# 복구 컨트롤러가 실행 모드라 실제 대피가 일어난다. 켜는 시각은 송이 · 성모와 맞춘다(eks-a · b 둘 다 켜져 학습 중일 때)
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: ENABLED_SIGNALS, value: "xid,pod_exit,site"}
  target:
    kind: Deployment
    name: classifier
