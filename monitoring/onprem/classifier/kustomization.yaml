# 분류기 (Alertmanager 웹훅 → 판정 → Kafka gpu.fault). 모니터링 클러스터 monitoring 네임스페이스. 담당: 이태림 (GPU-201)
# base는 Monitoring 레포의 릴리스 태그로 고정한다(main을 가리키지 않는다). Monitoring main 릴리스 때 배포 봇이 ref · newTag · digest를 같이 바꾼다 (update-image.yml base-ref, GPU-212)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- https://github.com/DevOops-Team/Monitoring//deploy/classifier/base?ref=v1.33.1
images:
- digest: sha256:af5e08051dbf0116fdf5eb611fb0bafba553bde8ecf0077712d9e2acbbf8ba97
  name: ghcr.io/devoops-team/classifier
  newName: ghcr.io/devoops-team/classifier
  newTag: 1.33.1
# GHCR 패키지가 비공개라 pull secret이 필요하다. Secret ghcr-pull은 Git에 없다(관리 클러스터 platform의 것을 복사해 넣음, Monitoring deploy/README.md)
# GPU 노드 소실 신호도 받는다(GPU-220, Monitoring v1.32.0). 코드 기본값은 xid,pod_exit.
# 복구 컨트롤러가 실행 모드라, GPU 노드가 1분 넘게 NotReady이거나 사라지면 그 노드 작업이 실제로 옮겨진다(isolate_migrate).
# 사이트 신호(초안 #96)를 켤 때는 이 값에 site를 더한다(xid,pod_exit,node_lost,site)
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value: [{name: ghcr-pull}]
  target:
    kind: Deployment
    name: classifier
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: ENABLED_SIGNALS, value: "xid,pod_exit,node_lost"}
  target:
    kind: Deployment
    name: classifier
