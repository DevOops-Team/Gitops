# 분류기 (Alertmanager 웹훅 → 판정 → Kafka gpu.fault). 모니터링 클러스터 monitoring 네임스페이스. 담당: 이태림 (GPU-201)
# base는 Monitoring 레포의 릴리스 태그로 고정한다(main을 가리키지 않는다). Monitoring main 릴리스 때 배포 봇이 ref · newTag · digest를 같이 바꾼다 (update-image.yml base-ref, GPU-212)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- https://github.com/DevOops-Team/Monitoring//deploy/monitoring-cluster/classifier?ref=v1.51.1
images:
- digest: sha256:867952d9a6e428418ccbc1c4c66541b4eeae6eb3405d9bb6192cc616e86c2f57
  name: ghcr.io/devoops-team/classifier
  newName: ghcr.io/devoops-team/classifier
  newTag: 1.50.0
# GHCR 패키지가 비공개라 pull secret이 필요하다. Secret ghcr-pull은 Git에 없다(관리 클러스터 platform의 것을 복사해 넣음, Monitoring deploy/README.md)
# GPU 노드 소실 · 사이트 신호도 받는다(GPU-220). 코드 기본값은 xid,pod_exit. 복구 컨트롤러가 실행 모드라 실제로 옮겨진다:
#  node_lost(Monitoring v1.32.0) = GPU 노드가 1분 넘게 NotReady이거나 사라지면 그 노드 작업을 isolate_migrate
#  site(11/25) = 펜싱 안 된 EKS의 지표가 2분 넘게 안 오면 그 클러스터 작업마다 fence_evacuate. Monitoring Alertmanager 라우트에도 site가 있어야 받는다.
#  job_failed(11/25, Monitoring v1.39.0) = 관리 클러스터 JobSet이 실패로 끝나면 그 작업 · 세대를 restart_in_place 1건. 죽은 Pod가 바로 지워져
#    Pod 종료 알람이 못 보는 경우를 잡는다. Alertmanager 라우트에도 job_failed가 있어야 받는다
#  EKS를 끌 때는 반드시 fence부터(K8s scheduling/ops/README.md, eks_gate.py fence). 빼먹으면 실제 대피가 시작된다
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value: [{name: ghcr-pull}]
  target:
    kind: Deployment
    name: classifier
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: ENABLED_SIGNALS, value: "xid,pod_exit,node_lost,site,job_failed,straggler"}
  target:
    kind: Deployment
    name: classifier
