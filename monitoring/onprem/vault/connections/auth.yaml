---
# 외부 Vault가 로그인 client JWT로 monitoring API에 TokenReview할 때 필요한 권한만 부여.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-monitoring-tokenreview
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-monitoring-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-monitoring-tokenreview
subjects:
- kind: ServiceAccount
  name: alertmanager-sync
  namespace: monitoring
- kind: ServiceAccount
  name: grafana-sync
  namespace: monitoring
- kind: ServiceAccount
  name: postgres-exporter-sync
  namespace: monitoring
- kind: ServiceAccount
  name: ghcr-pull-sync
  namespace: monitoring
