apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-sync
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: alertmanager-sync
  namespace: monitoring
spec:
  vaultConnectionRef: vault-vm
  method: kubernetes
  mount: monitoring
  kubernetes:
    role: monitoring-alertmanager-sync
    serviceAccount: alertmanager-sync
---
