apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-root-eks-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: bootstrap/eks-a/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
