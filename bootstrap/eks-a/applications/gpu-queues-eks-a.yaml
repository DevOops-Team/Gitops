apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-queues-eks-a
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-eks-a
  destination:
    name: eks-a
    namespace: training
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: eks/scheduling/overlays/eks-a
