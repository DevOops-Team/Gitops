# eks-a 워커: Kueue · JobSet · 워커 큐 · relocator RBAC
# project gpu-eks-a와 클러스터 등록(eks-a)은 bootstrap 담당 작업에서 (root.yaml · project.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-scheduling-eks-a
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-eks-a
  destination:
    name: eks-a
    namespace: kueue-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: eks/scheduling/overlays/eks-a
