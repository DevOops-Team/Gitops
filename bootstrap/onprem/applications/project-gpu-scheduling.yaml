# 스케줄링(김성모) 전용 AppProject. gpu-platform에는 kueue-system·jobset-system 목적지와
# Kueue·JobSet 설치에 필요한 클러스터 범위 객체(APIService, MAP/VAP, WorkloadPriorityClass 등)가 없어서 따로 둔다
# root(gpu-root, project default)가 이 디렉토리를 sync하므로 Application보다 먼저(-30) 생긴다
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gpu-scheduling
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  description: On-prem manager scheduling (Kueue · JobSet · MultiKueue queues · dispatcher · relocator)
  sourceRepos:
  - https://github.com/DevOops-Team/Gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: kueue-system
  - server: https://kubernetes.default.svc
    namespace: jobset-system
  - server: https://kubernetes.default.svc
    namespace: platform
  - server: https://kubernetes.default.svc
    namespace: training
  clusterResourceWhitelist:          # 업스트림 Kueue·JobSet 설치물이 클러스터 범위 객체를 많이 가짐
  - group: '*'
    kind: '*'
