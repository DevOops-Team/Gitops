apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-vault-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system
  # 수동 sync: 기존 Helm release 인계와 diff를 확인한 뒤 실행한다.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - ServerSideApply=true  # 큰 CRD를 client-side last-applied annotation에 넣지 않음
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 1.6.0
      helm:
        releaseName: vault-secrets-operator
        valueFiles:
          - $values/onprem/platform/vault/operator/values.yaml
    - repoURL: https://github.com/DevOops-Team/Gitops.git
      targetRevision: main
      ref: values
