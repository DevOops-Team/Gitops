apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-backend-recovery-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: onprem/platform/backend/recovery-api/tls
  # 내부 CA 발급은 사전 준비 후 수동 Sync. 기본 Backend 앱은 아직 HTTP overlay 유지.
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
