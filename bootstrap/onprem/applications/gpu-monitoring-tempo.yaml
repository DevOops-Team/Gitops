# 모니터링 클러스터 저장 층: Tempo(트레이스, 블록 S3)
# 차트 grafana-community/tempo + Monitoring deploy/values/tempo.yaml. Secret tempo-s3-cert 필요(Monitoring scripts/create-secrets.sh s3-certs). 담당: 이태림 (ADR-18 · ADR-21)
# 자동 sync: Monitoring main이나 이 파일이 바뀌면 반영한다. prune · selfHeal은 끈다(저장소 리소스를 자동으로 지우지 않고, 비상 때 deploy-k8s.sh로 넣은 변경을 되돌리지 않게) (GPU-184)
# 비상 경로: 관리 클러스터가 죽어 Argo CD를 못 쓰면 Monitoring 레포 scripts/deploy-k8s.sh. 차트 버전은 그쪽 deploy/versions.env와 같게 유지한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitoring-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-monitoring
  destination:
    name: monitoring
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 3.2.1
    helm:
      releaseName: tempo     # deploy-k8s.sh가 깐 helm 릴리스 이름과 같게: 지금 떠 있는 리소스를 그대로 넘겨받는다
      valueFiles:
      - $values/deploy/values/tempo.yaml
  - repoURL: https://github.com/DevOops-Team/Monitoring.git
    targetRevision: main
    ref: values
