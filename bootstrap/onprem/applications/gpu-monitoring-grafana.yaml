# 모니터링 클러스터 저장 층: Grafana
# 차트 grafana-community/grafana + Monitoring deploy/monitoring-cluster/values/grafana.yaml. Secret grafana-secrets 필요(Monitoring scripts/create-secrets.sh), 대시보드 ConfigMap은 gpu-monitoring-base가 만든다. 담당: 이태림 (ADR-18 · ADR-21)
# 자동 sync: Monitoring main이나 이 파일이 바뀌면 반영한다. prune · selfHeal은 끈다(저장소 리소스를 자동으로 지우지 않고, 비상 때 deploy-k8s.sh로 넣은 변경을 되돌리지 않게) (GPU-184)
# 비상 경로: 관리 클러스터가 죽어 Argo CD를 못 쓰면 Monitoring 레포 scripts/deploy-k8s.sh. 차트 버전은 그쪽 deploy/versions.env와 같게 유지한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitoring-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-monitoring
  destination:
    name: monitoring
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.4.0
    helm:
      releaseName: grafana     # deploy-k8s.sh가 깐 helm 릴리스 이름과 같게: 지금 떠 있는 리소스를 그대로 넘겨받는다
      valueFiles:
      - $values/deploy/monitoring-cluster/values/grafana.yaml
  - repoURL: https://github.com/DevOops-Team/Monitoring.git
    targetRevision: main
    ref: values
