# 모니터링 클러스터 저장 층: node-exporter(모니터링 클러스터 노드 지표)
# 차트 prometheus-community/prometheus-node-exporter + Monitoring deploy/values/node-exporter.yaml. 담당: 이태림 (ADR-18 · ADR-21)
# 수동 sync(automated 없음): 저장소라 처음엔 차이를 보고 누른다. automated로 바꾼 뒤에도 prune은 끈다(GPU-184)
# 비상 경로: 관리 클러스터가 죽어 Argo CD를 못 쓰면 Monitoring 레포 scripts/deploy-k8s.sh. 차트 버전은 그쪽 deploy/versions.env와 같게 유지한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitoring-node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-monitoring
  destination:
    name: monitoring
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 5.0.0
    helm:
      releaseName: node-exporter     # deploy-k8s.sh가 깐 helm 릴리스 이름과 같게: 지금 떠 있는 리소스를 그대로 넘겨받는다
      valueFiles:
      - $values/deploy/values/node-exporter.yaml
  - repoURL: https://github.com/DevOops-Team/Monitoring.git
    targetRevision: main
    ref: values
