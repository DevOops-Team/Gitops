apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    # ADR-23: 이미지 digest는 봇이 Gitops main에 커밋 → 자동 반영
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    # 복구 조회 API 내부 HTTPS (GPU-119): ../onprem + nginx TLS 사이드카 · Service backend-recovery:8443.
    # 되돌릴 때는 overlays/onprem으로 (onprem/platform/backend/recovery-api/README.md 롤백)
    path: onprem/platform/backend/overlays/onprem-recovery-api
