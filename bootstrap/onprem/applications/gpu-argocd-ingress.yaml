apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-argocd-ingress
  namespace: argocd
  annotations:
    # Traefik · cert-manager · ClusterIssuer(-10 · -5) 뒤
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-argocd-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: onprem/platform/argocd-ingress
