apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# sync-wave 순서: foundation(-20) → traefik · cert-manager · cainjector(-10) → issuer(-5) → frontend · backend(0)
# → scheduling: gpu-scheduling 프로젝트(-30) · kueue · jobset(10) → queues(11) → scheduling-controllers(12)
# recovery-controller Application은 담당 작업에서 추가
resources:
- gpu-foundation.yaml
- gpu-traefik.yaml
- gpu-cert-manager.yaml
- gpu-cert-manager-cainjector.yaml
- gpu-cert-manager-issuer.yaml
- gpu-frontend.yaml
- gpu-backend.yaml
- project-gpu-scheduling.yaml
- gpu-kueue.yaml
- gpu-jobset.yaml
- gpu-queues.yaml
- gpu-scheduling-controllers.yaml
