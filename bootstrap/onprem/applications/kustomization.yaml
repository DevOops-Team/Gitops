apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# sync-wave 순서: foundation(-20) → metallb(-15) → metallb-config(-12) → traefik · cert-manager · cainjector(-10)
#   → jobset(-8) → kueue(-7) → issuer · multikueue-queues · scheduling-common(-5) → frontend · backend · dispatcher · job-watcher(0)
# monitoring-agents(0): Monitoring 레포 deploy/agents (ADR-18 · ADR-21)
resources:
- gpu-foundation.yaml
- gpu-metallb.yaml
- gpu-metallb-config.yaml
- gpu-traefik.yaml
- gpu-cert-manager.yaml
- gpu-cert-manager-cainjector.yaml
- gpu-cert-manager-issuer.yaml
- gpu-jobset.yaml
- gpu-kueue.yaml
- gpu-multikueue-queues.yaml
- gpu-scheduling-common.yaml
- gpu-frontend.yaml
- gpu-backend.yaml
- gpu-dispatcher.yaml
- gpu-job-watcher.yaml        # (잡) 감시기, data-system (GPU-145)
- gpu-eks-scheduling.yaml     # ApplicationSet: EKS 워커마다 Application (GPU-133)
- gpu-monitoring-agents.yaml
