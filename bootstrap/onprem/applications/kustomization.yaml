apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# sync-wave 순서: foundation(-20) → metallb(-15) → metallb-config(-12) → traefik · cert-manager · cainjector(-10)
#   → jobset(-8) → kueue(-7) → issuer · multikueue-queues · scheduling-common(-5)
#   → frontend · backend · dispatcher · relocator · recovery-controller · job-watcher(0)
# monitoring-agents(0): Monitoring 레포 deploy/agents (ADR-18 · ADR-21)
resources:
- gpu-foundation.yaml
- gpu-metallb.yaml
- gpu-metallb-config.yaml
- gpu-traefik.yaml
- gpu-cert-manager.yaml
- gpu-cert-manager-cainjector.yaml
- gpu-cert-manager-issuer.yaml
- gpu-jobset.yaml
- gpu-kueue.yaml
- gpu-multikueue-queues.yaml
- gpu-scheduling-common.yaml
- gpu-frontend.yaml
- gpu-backend.yaml
- gpu-dispatcher.yaml
- gpu-relocator.yaml          # 재배치 실행기 (GPU-173). Secret platform/relocator-aws 필요
- gpu-recovery-controller.yaml  # 복구 컨트롤러 (GPU-173). 지금은 replicas 0
- gpu-job-watcher.yaml        # (잡) 감시기, data-system (GPU-145)
- gpu-collector.yaml          # 수집기 Kafka → 데이터 DB, data-system (GPU-178). Secret collector-db 필요
- gpu-eks-scheduling.yaml     # ApplicationSet: EKS 워커마다 Application (GPU-133)
- gpu-monitoring-agents.yaml
# 모니터링 클러스터 저장 층 (원격 클러스터 monitoring, project gpu-monitoring, 수동 sync — GPU-184)
- gpu-monitoring-local-path.yaml
- gpu-monitoring-base.yaml
- gpu-monitoring-node-exporter.yaml
- gpu-monitoring-kube-state-metrics.yaml
- gpu-monitoring-loki.yaml
- gpu-monitoring-tempo.yaml
- gpu-monitoring-blackbox.yaml
- gpu-monitoring-alertmanager.yaml
- gpu-monitoring-grafana.yaml
- gpu-monitoring-logs.yaml       # 모니터링 클러스터 자신의 로그: Fluent Bit (GPU-139)
- gpu-monitoring-kafka-exporter.yaml   # 컨슈머 그룹 lag: kafka_exporter (GPU-139)
