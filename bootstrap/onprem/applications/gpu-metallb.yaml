apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-metallb
  namespace: argocd
  annotations:
    # namespaces(-20) 다음, Traefik(-10)보다 먼저 (Traefik Service가 VIP를 받을 수 있게)
    argocd.argoproj.io/sync-wave: '-15'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # controller가 webhook 인증서를 직접 만들고 caBundle을 채운다 → Git과 다르다고 보지 않게 제외
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: bgppeers.metallb.io
    jsonPointers:
    - /spec/conversion/webhook/clientConfig/caBundle
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: metallb-webhook-configuration
    jqPathExpressions:
    - .webhooks[].clientConfig.caBundle
  - kind: Secret
    name: metallb-webhook-cert
    namespace: metallb-system
    jsonPointers:
    - /data
  sources:
  - repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.9
    helm:
      releaseName: metallb
      valueFiles:
      - $values/onprem/platform/metallb/values.yaml
  - repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    ref: values
