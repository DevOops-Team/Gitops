apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitoring-vault-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  project: gpu-monitoring-vault
  destination:
    name: monitoring
    namespace: vault-secrets-operator-system
  # 원격 클러스터의 최초 설치. 기존 설치가 발견되면 버전/values/소유권부터 비교한다.
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - FailOnSharedResource=true
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: 1.6.0
    helm:
      releaseName: vault-secrets-operator
      valueFiles:
      - $values/monitoring/onprem/vault/operator/values.yaml
  - repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    ref: values
