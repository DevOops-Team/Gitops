apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-vault-connections
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: onprem/platform/vault/common
  # 수동 sync, 자동 prune 없음. 운영 인계 순서는 vault/README.md 참고.
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
