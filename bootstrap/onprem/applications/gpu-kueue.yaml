apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-kueue
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-7'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  syncPolicy:
    # 버전 고정(ADR-9)이라 Git 변경 = 의도한 변경. 웹훅 failurePolicy Fail이라 손으로 바꾼 상태가 남지 않게 selfHeal
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    - ServerSideApply=true     # CRD가 커서 client-side apply의 last-applied annotation 한도(256KiB)를 넘음
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: onprem/multikueue/kueue
