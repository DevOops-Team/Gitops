# 모니터링 클러스터: postgres_exporter(데이터 파트 PostgreSQL 172.30.0.50 상태). 원격으로 붙는다
# 차트 prometheus-community/prometheus-postgres-exporter + Monitoring deploy/monitoring-cluster/values/postgres-exporter.yaml. 담당: 이태림 (ADR-18 · ADR-21)
# Secret postgres-exporter-secrets는 Git에 없다: Monitoring scripts/create-secrets.sh postgres-exporter로 먼저 만든다(없으면 Pod가 대기)
# 자동 sync: Monitoring main이나 이 파일이 바뀌면 반영한다. prune · selfHeal은 끈다(다른 모니터링 Application과 같은 정책) (GPU-139)
# 비상 경로: 관리 클러스터가 죽어 Argo CD를 못 쓰면 Monitoring 레포 scripts/deploy-k8s.sh. 차트 버전은 그쪽 deploy/versions.env와 같게 유지한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitoring-postgres-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: gpu-monitoring
  destination:
    name: monitoring
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-postgres-exporter
    targetRevision: 8.2.2
    helm:
      releaseName: postgres-exporter     # deploy-k8s.sh가 쓰는 helm 릴리스 이름과 같게
      valueFiles:
      - $values/deploy/monitoring-cluster/values/postgres-exporter.yaml
  - repoURL: https://github.com/DevOops-Team/Monitoring.git
    targetRevision: main
    ref: values
