apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-cert-manager-issuer
  namespace: argocd
  annotations:
    # cert-manager(-10)가 CRD를 만든 뒤, frontend Certificate(0)보다 먼저
    argocd.argoproj.io/sync-wave: '-5'
spec:
  project: gpu-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: onprem/platform/cert-manager/issuer
