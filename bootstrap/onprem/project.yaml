apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gpu-platform
  namespace: argocd
spec:
  description: On-prem manager platform (namespaces · ingress · cert-manager · frontend · backend · Kueue · JobSet · scheduling controllers)
  sourceRepos:
  - https://github.com/DevOops-Team/Gitops.git
  - https://github.com/DevOops-Team/Monitoring.git   # 모니터링 수집 층 매니페스트 (Monitoring deploy/agents, 이태림)
  - https://traefik.github.io/charts
  - https://charts.jetstack.io
  - https://metallb.github.io/metallb
  - registry.k8s.io/kueue/charts       # Kueue 공식 Helm 차트 (OCI)
  - registry.k8s.io/jobset/charts      # JobSet 공식 Helm 차트 (OCI)
  destinations:
  - server: https://kubernetes.default.svc
    namespace: platform
  - server: https://kubernetes.default.svc
    namespace: training
  - server: https://kubernetes.default.svc
    namespace: ingress-system
  - server: https://kubernetes.default.svc
    namespace: cert-manager
  - server: https://kubernetes.default.svc
    namespace: monitoring
  - server: https://kubernetes.default.svc
    namespace: metallb-system
  - server: https://kubernetes.default.svc
    namespace: kueue-system
  - server: https://kubernetes.default.svc
    namespace: jobset-system
  - server: https://kubernetes.default.svc
    namespace: kube-system     # Kueue visibility API의 extension-apiserver-authentication-reader RoleBinding 하나
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: MutatingAdmissionPolicy           # Kueue nominatedClusterNames 정리 (GPU-129)
  - group: admissionregistration.k8s.io
    kind: MutatingAdmissionPolicyBinding
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy         # scheduling admission policy (GPU-131)
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
  - group: apiregistration.k8s.io
    kind: APIService                        # Kueue visibility API
  - group: cert-manager.io
    kind: ClusterIssuer
  - group: kueue.x-k8s.io
    kind: ResourceFlavor
  - group: kueue.x-k8s.io
    kind: ClusterQueue
  - group: kueue.x-k8s.io
    kind: AdmissionCheck
  - group: kueue.x-k8s.io
    kind: MultiKueueCluster
  - group: kueue.x-k8s.io
    kind: MultiKueueConfig
  - group: kueue.x-k8s.io
    kind: WorkloadPriorityClass
  - group: networking.k8s.io
    kind: IngressClass
