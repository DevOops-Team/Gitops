apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOops-Team/Gitops.git
    targetRevision: main
    path: bootstrap/onprem/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # app-of-apps: applications/ 변경을 자동 반영. 자식 Application에 finalizer가 없어 prune은 Application 객체만 지우고 워크로드는 남긴다
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
