apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# eks-a: IaC topology test: GPU 2장(Spot), 예비 0 (scripts/infra/scheduling-contract.md)
resources:
- ../../base
patches:
- target: {kind: ConfigMap, name: devoops-cluster-info}
  patch: |-
    - op: replace
      path: /data/CLUSTER_NAME
      value: eks-a
- target: {kind: ClusterQueue, name: train-cq}
  patch: |-
    - op: replace
      path: /spec/resourceGroups/0/flavors/0/resources/0/nominalQuota
      value: "2"
- target: {kind: ClusterQueue, name: recovery-cq}
  patch: |-
    - op: replace
      path: /spec/resourceGroups/0/flavors/0/resources/0/nominalQuota
      value: "0"
