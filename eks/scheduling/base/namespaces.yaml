# Helm 차트는 Namespace를 만들지 않는다. 앱을 지워도 남게 Prune=false
# (kueue-system에는 IaC가 만든 multikueue-sa 토큰이 있고, training에는 학습 Pod가 돈다)
apiVersion: v1
kind: Namespace
metadata:
  name: kueue-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: jobset-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: training
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
