# EKS 워커 Kueue v0.20.4 — 공식 Helm 차트 oci://registry.k8s.io/kueue/charts/kueue 의 values (모든 EKS 공통)
# MultiKueue가 관리 클러스터에서 복사본을 넣으면 이 Kueue가 쿼터를 잡고 JobSet을 실행한다.
# dispatcherName · MAP · workerLostTimeout은 관리 클러스터 전용이라 없다.
controllerManager:
  replicas: 1                  # EKS 시스템(CPU) 노드 1대
  manager:
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: '2', memory: 512Mi}

managerConfig:
  controllerManagerConfigYaml: |-
    apiVersion: config.kueue.x-k8s.io/v1beta2
    # Kueue가 도는 네임스페이스. 웹훅 인증서 이름·MultiKueue kubeconfig Secret 위치도 여기
    namespace: kueue-system
    clientConnection:
      burst: 500
      qps: 300
    controller:
      groupKindConcurrency:
        ClusterQueue.kueue.x-k8s.io: 5
        Cohort.kueue.x-k8s.io: 1
        Job.batch: 5
        LocalQueue.kueue.x-k8s.io: 5
        Pod: 5
        ResourceFlavor.kueue.x-k8s.io: 1
        Workload.kueue.x-k8s.io: 10
    health:
      healthProbeBindAddress: :8081
    # 큐 할당량은 GPU만 센다(ADR · clusterqueue.yaml). cpu · memory 요청은 할당량 계산에서 뺀다.
    # 빼지 않으면 coveredResources에 없는 자원이라 NoMatchingFlavor로 영원히 대기한다.
    resources:
      excludeResourcePrefixes:
      - cpu
      - memory
      - ephemeral-storage
    integrations:
      frameworks:
      - batch/job
      - jobset.x-k8s.io/jobset
    internalCertManagement:
      enable: true
      webhookSecretName: kueue-webhook-server-cert
      webhookServiceName: kueue-webhook-service
    kind: Configuration
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    metrics:
      bindAddress: :8443
      # 큐별 GPU 쿼터 · 사용량 지표 (kueue_cluster_queue_resource_usage · kueue_cluster_queue_nominal_quota).
      # 복구 잡이 큐에서 자리가 없어 기다리는지 보는 용도, Agent가 수집 (GPU-186)
      enableClusterQueueResources: true
    webhook:
      port: 9443
    # 갱 스케줄링(전부 아니면 전무): 승인 후 timeout 안에 Pod 전부 Ready가 안 되면 통째로 내림
    # timeout 10m: PyTorch CUDA trainer 이미지(수 GB) pull · 모델 다운로드 시간
    waitForPodsReady:
      timeout: 10m
      # 끔: 켜면 앞 잡 Pod가 전부 Ready(이미지 pull · ckpt-init 포함)일 때까지 이 워커 전체가 다음 잡(복구 잡 포함)을 안 받음.
      # 새 노드에서는 60초를 넘겨 디스패처 재지명(RENOMINATE_SECONDS)과 충돌 (GPU-260).
      # 노드가 쿼터보다 적을 때의 반쪽 교착은 디스패처가 실제 노드 여유를 보고 지명해서 대부분 막고,
      # 남는 경우(잡 시작 직후 학습 노드 2대 이상 동시 장애)는 위 timeout으로 내렸다가 다시 넣음
      blockAdmission: false
      # 실행 중 Pod가 죽었을 때 Kueue가 혼자 내리고 다시 넣지 않게 끔.
      # 실행 중 장애의 재시작 여부는 장애복구 파트가 판단하고 재배치 요청으로만 처리 (세대 번호 없이 재시작되는 것 방지)
      recoveryTimeout: 0s
      # 처음 입장할 때의 갱 실패(timeout)는 Pod를 내리고 GPU를 반납한 뒤 Kueue가 같은 세대로 다시 큐에 넣음
      # 최대 3번까지 재시도, 한도에 닿으면 Workload 비활성화(spec.active=false). 실행 중 장애는 위 recoveryTimeout: 0s로 복구 컨트롤러가 처리
      requeuingStrategy:
        backoffLimitCount: 3
